name: Idea
description: Something you'd like Rookahead to do.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would help
      description: What you're trying to do, and what gets in the way today.
