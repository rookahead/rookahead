    <!-- Your theme before the first paint (App.tsx keeps it up to date after), so the page doesn't flash dark. -->
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('rookahead.settings.v2') || '{}')
        var a = s.appearance || 'dark'
        var r = document.documentElement
        // The Android app (it adds RookaheadApp to its user agent): the page draws under the phone's bars.
        if (/RookaheadApp/.test(navigator.userAgent)) r.dataset.app = ''
        try {
          // Home's loading screen is Home's own shape (.boot-home): the sidebar as it was left, and the greeting
          // a signed-in visitor gets.
          if (location.pathname === '/') r.dataset.boot = 'home'
          if (localStorage.getItem('rookahead.sidebar') === 'rail') r.dataset.bootRail = ''
          var sync = JSON.parse(localStorage.getItem('rookahead.sync.v1') || 'null')
          if (sync && sync.user) r.dataset.bootUser = ''
          // A first visit (no username, no games, not signed in) opens on the welcome card instead.
          var played = JSON.parse(localStorage.getItem('rookahead.games.v1') || '[]')
          if (!s.chesscomUser && !s.lichessUser && !(sync && sync.user) && !(played && played.length)) r.dataset.bootFirst = ''
        } catch (e) {}
        r.dataset.theme = a === 'light' ? 'light' : a === 'system' && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        // One colour for now, whatever an older version saved (settings.ts, PALETTES).
        r.dataset.palette = 'cobalt'
      } catch (e) {}

    <!-- If the app doesn't start (a bundle that won't load, a connection that gave up), say so instead of loading
         forever, with a Reload that fetches the bundles fresh and drops the service worker's copies first. -->
    <script>
      ;(function () {
        var shown = false
        function fail() {
          if (shown || !document.querySelector('#root > .boot')) return
          shown = true
          var box = document.createElement('div')
          box.className = 'boot-fail'
          box.setAttribute('role', 'alert')
          box.setAttribute('style', 'position:fixed;left:50%;bottom:32px;transform:translateX(-50%);z-index:99;display:flex;align-items:center;gap:16px;padding:14px 16px 14px 20px;border-radius:14px;background:#222b31;color:#dae4ec;font:500 15px/1.4 system-ui,sans-serif;box-shadow:0 12px 32px rgba(0,0,0,.4)')
          box.innerHTML = '<span><strong style="display:block">Rookahead didn\u2019t load.</strong><span style="opacity:.75;font-size:13px">Check your connection, then try again.</span></span><button type="button" style="border:0;border-radius:10px;padding:10px 16px;background:#22a2ff;color:#00182b;font:700 14px system-ui,sans-serif;cursor:pointer">Reload</button>'
          box.querySelector('button').onclick = function () {
            var bundles = [].slice.call(document.querySelectorAll('script[type="module"][src], link[rel="modulepreload"], link[rel="stylesheet"][href^="/assets/"]')).map(function (el) {
              return el.src || el.href
            })
            var fresh = bundles.map(function (src) {
              return fetch(src, { cache: 'reload' }).catch(function () {})
            })
            var sw = navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister() })) }) : null
            var cached = window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k) })) }) : null
            Promise.all(fresh.concat([sw, cached])).then(
              function () { location.reload() },
              function () { location.reload() },
            )
          }
          document.body.appendChild(box)
        }
        addEventListener(
          'error',
          function (e) {
            var t = e.target
            // Only Rookahead's own files: a script someone else's (Cloudflare's analytics, which ad blockers stop) failing
            // says nothing about the app.
            var own = t && (t.src || t.href) && new URL(t.src || t.href, location.href).origin === location.origin
            if (own && (t.tagName === 'SCRIPT' || (t.tagName === 'LINK' && /stylesheet|modulepreload/.test(t.rel)))) fail()
          },
          true,
        )
        setTimeout(fail, 20000)
      })()
    </script>
