<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installable as an app (Add to Home Screen): name, icons and full-screen launch. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Rookahead" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="theme-color" content="#1a1206" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Rookahead · Free chess game review</title>
    <meta name="description" content="Free, unlimited chess game review with Stockfish 19 in your browser. Every move graded from Legendary to Blunder, with accuracy and key moments. Paste a PGN and go. No sign-up." />
    <!-- One address for search engines: www and rookahead.pages.dev serve the same site. -->
    <link rel="canonical" href="https://rookahead.com/" />
    <!-- Link previews (WhatsApp, Reddit, Discord, X). Image source: scripts/og-image.html -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rookahead.com/" />
    <meta property="og:title" content="Rookahead · Free chess game review" />
    <meta property="og:description" content="Free, unlimited chess game review with Stockfish 19 in your browser. Every move graded from Legendary to Blunder, with accuracy and key moments. Paste a PGN and go. No sign-up." />
    <meta property="og:image" content="https://rookahead.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <!-- Your theme before the first paint (App.tsx keeps it up to date after), so the page doesn't flash dark. -->
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('rookahead.settings.v2') || '{}')
        var a = s.appearance || 'dark'
        var r = document.documentElement
        r.dataset.theme = a === 'light' ? 'light' : a === 'system' && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        // Settings from before the tonal themes: Sky was the default then, Gold is now (settings.ts).
        if (s.palette && !(s.palette === 'sky' && !s.themes)) r.dataset.palette = s.palette
        if (a === 'black') r.setAttribute('data-black', '')
      } catch (e) {}
    </script>
    <!-- Until the app is up: the page's shape in placeholders (index.css, .boot). React replaces it. -->
    <div id="root">
      <div class="boot" aria-busy="true" aria-label="Loading Rookahead">
        <div class="boot-side">
          <img src="/favicon.svg" alt="" width="30" height="30" />
          <span class="skel" style="width: 70%; height: 14px"></span>
          <span class="skel" style="width: 55%; height: 14px"></span>
          <span class="skel" style="width: 62%; height: 14px"></span>
          <span class="skel" style="width: 48%; height: 14px"></span>
        </div>
        <div class="boot-main">
          <div class="boot-head">
            <img src="/favicon.svg" alt="" width="30" height="30" />
            <span class="skel" style="width: 110px; height: 18px"></span>
          </div>
          <span class="skel" style="width: 46%; height: 28px"></span>
          <span class="skel" style="width: 64%; height: 14px"></span>
          <span class="skel boot-card tall"></span>
          <span class="skel boot-card"></span>
        </div>
        <div class="boot-tabs"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
