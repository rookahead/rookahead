<!doctype html>
<html lang="en">

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Rookahead · Free chess game review</title>
    <meta name="description" content="Free, unlimited chess game review with Stockfish 19 in your browser. Every move graded from Legendary to Blunder, with accuracy and key moments. Paste a PGN and go. No sign-up." />
    <!-- One address for search engines: www and rookahead.pages.dev serve the same site. -->
    <link rel="canonical" href="https://rookahead.com/" />
    <!-- Link previews (WhatsApp, Reddit, Discord, X). Image source: scripts/og-image.html -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rookahead.com/" />
    <meta property="og:title" content="Rookahead · Free chess game review" />
    <meta property="og:description" content="Free, unlimited chess game review with Stockfish 19 in your browser. Every move graded from Legendary to Blunder, with accuracy and key moments. Paste a PGN and go. No sign-up." />
    <meta property="og:image" content="https://rookahead.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Who and what this is, for search engines: the name "Rookahead" (not a typo of "rook ahead"), a free chess app, and where else it lives. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://rookahead.com/#website",
            "name": "Rookahead",
            "alternateName": [
              "Rook ahead",
              "RookAhead"
            ],
            "url": "https://rookahead.com/",
            "publisher": {
              "@id": "https://rookahead.com/#org"
            }
          },
          {
            "@type": "Organization",
            "@id": "https://rookahead.com/#org",
            "name": "Rookahead",
            "url": "https://rookahead.com/",
            "logo": "https://rookahead.com/icon-512.png",
            "email": "support@rookahead.com",
            "sameAs": [
              "https://www.youtube.com/channel/UCBgLOKhkiQKsYYEhi7mW-1A",
              "https://github.com/rookahead/rookahead",
              "https://discord.gg/ebm3NZNHZH"
            ]
          },
          {
            "@type": "WebApplication",
            "@id": "https://rookahead.com/#app",
            "name": "Rookahead",
            "url": "https://rookahead.com/",
            "applicationCategory": "GameApplication",
            "operatingSystem": "Any web browser, Android",
            "browserRequirements": "Requires JavaScript",
            "description": "Free, unlimited chess game review with Stockfish 19 in your browser. Every move graded from Legendary to Blunder, with accuracy and key moments.",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            },
            "publisher": {
              "@id": "https://rookahead.com/#org"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <!-- Your theme before the first paint (App.tsx keeps it up to date after), so the page doesn't flash dark. -->
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('rookahead.settings.v2') || '{}')
        var a = s.appearance || 'dark'
        var r = document.documentElement
        try {
          // Home's loading screen is Home's own shape (.boot-home): the sidebar as it was left, and the greeting
          // a signed-in visitor gets.
          if (location.pathname === '/') r.dataset.boot = 'home'
          if (localStorage.getItem('rookahead.sidebar') === 'rail') r.dataset.bootRail = ''
          var sync = JSON.parse(localStorage.getItem('rookahead.sync.v1') || 'null')
          if (sync && sync.user) r.dataset.bootUser = ''
          // A first visit (no username, no games, not signed in) opens on the welcome card instead.
          var played = JSON.parse(localStorage.getItem('rookahead.games.v1') || '[]')
          if (!s.chesscomUser && !s.lichessUser && !(sync && sync.user) && !(played && played.length)) r.dataset.bootFirst = ''
          var saved = JSON.parse(localStorage.getItem('rookahead.reviews.v1') || '{}')
          // Reviews to find your mistakes in: the plan has four steps, and My games the colours' key.
          for (var key in saved) {
            r.dataset.bootReviews = ''
            break
          }
        } catch (e) {}
        r.dataset.theme = a === 'light' ? 'light' : a === 'system' && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        // Gold was everyone's colour for a day, as the default: those settings read as Sky (settings.ts).
        if (s.palette && !(s.palette === 'gold' && (s.themes || 0) < 3)) r.dataset.palette = s.palette
        if (a === 'black') r.setAttribute('data-black', '')
        // The tab's icon in your colour from the start, as App.tsx draws it after (RookLogo.tsx, faviconUrl).
        var css = getComputedStyle(r)
        var tile = css.getPropertyValue('--brand').trim()
        var rook = css.getPropertyValue('--brand-ink').trim()
        if (tile && rook)
          document.querySelector('link[rel="icon"]').href =
            'data:image/svg+xml,' +
            encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="' + tile + '"/><path transform="translate(4 4)" fill="' + rook + '" d="M5 3H8V5H10.5V3H13.5V5H16V3H19V7.72L15 6.3V7.3H10.5A0.7 0.7 0 0 0 10.5 8.7H15V9.7L19 8.28V11H15.5C15.5 15 16.5 17 19.5 18V21H4.5V18C7.5 17 8.5 15 8.5 11H5Z"/></svg>')
      } catch (e) {}
    </script>
    <!-- Until the app is up: the page's shape in placeholders (index.css, .boot). React replaces it. -->
    <div id="root">
      <div class="boot" aria-busy="true" aria-label="Loading Rookahead">
        <div class="boot-side">
          <span class="brand-logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 3H8V5H10.5V3H13.5V5H16V3H19V7.72L15 6.3V7.3H10.5A0.7 0.7 0 0 0 10.5 8.7H15V9.7L19 8.28V11H15.5C15.5 15 16.5 17 19.5 18V21H4.5V18C7.5 17 8.5 15 8.5 11H5Z" /></svg></span>
          <span class="skel" style="width: 70%; height: 14px"></span>
          <span class="skel" style="width: 55%; height: 14px"></span>
          <span class="skel" style="width: 62%; height: 14px"></span>
          <span class="skel" style="width: 48%; height: 14px"></span>
        </div>
        <div class="boot-main">
          <div class="boot-head">
            <span class="brand-logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 3H8V5H10.5V3H13.5V5H16V3H19V7.72L15 6.3V7.3H10.5A0.7 0.7 0 0 0 10.5 8.7H15V9.7L19 8.28V11H15.5C15.5 15 16.5 17 19.5 18V21H4.5V18C7.5 17 8.5 15 8.5 11H5Z" /></svg></span>
            <span class="skel" style="width: 110px; height: 18px"></span>
          </div>
          <span class="skel" style="width: 46%; height: 28px"></span>
          <span class="skel" style="width: 64%; height: 14px"></span>
          <span class="skel boot-card tall"></span>
          <span class="skel boot-card"></span>
        </div>
        <div class="boot-tabs"></div>
      </div>
      <!-- Home: its cards where they'll be, each as tall as the placeholder that takes its place. -->
      <div class="boot boot-home" aria-busy="true" aria-label="Loading Rookahead">
        <div class="boot-desk">
          <div class="sidebar boot-sidebar">
            <span class="brand-logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 3H8V5H10.5V3H13.5V5H16V3H19V7.72L15 6.3V7.3H10.5A0.7 0.7 0 0 0 10.5 8.7H15V9.7L19 8.28V11H15.5C15.5 15 16.5 17 19.5 18V21H4.5V18C7.5 17 8.5 15 8.5 11H5Z" /></svg></span>
            <span class="skel" style="width: 70%; height: 14px"></span>
            <span class="skel" style="width: 55%; height: 14px"></span>
            <span class="skel" style="width: 62%; height: 14px"></span>
            <span class="skel" style="width: 48%; height: 14px"></span>
          </div>
          <div class="shell-page">
            <div class="home">
              <div class="home-main">
                <div class="home-welcome boot-welcome boot-returning">
                  <span class="skel" style="width: 300px; height: 22px"></span>
                  <span class="skel" style="width: 340px; height: 12px"></span>
                </div>
                <div class="home-actions boot-returning">
                  <div class="home-card boot-fill" style="--h: 83.3px"><span class="skel boot-title"></span></div>
                  <div class="home-card boot-fill" style="--h: 83.3px"><span class="skel boot-title"></span></div>
                </div>
                <div class="home-card boot-fill boot-returning" style="--h: 108px"><span class="skel boot-title"></span></div>
                <div class="home-card boot-fill boot-returning boot-games"><span class="skel boot-title"></span></div>
                <div class="home-welcome boot-fill boot-first" style="--h: 31.9px"><span class="skel" style="width: 280px; height: 26px"></span></div>
                <div class="home-card accent-card boot-fill boot-first" style="--h: 300.9px"><span class="skel boot-title"></span></div>
                <div class="home-card boot-fill boot-first boot-games-empty"><span class="skel boot-title"></span></div>
              </div>
              <div class="home-side">
                <div class="home-card boot-fill boot-returning boot-plan"><span class="skel boot-title"></span></div>
                <div class="home-card boot-fill boot-quick"><span class="skel boot-title"></span></div>
                <div class="home-card daily-card">
                  <span class="skel boot-daily-head"></span>
                  <span class="skel boot-board"></span>
                  <span class="boot-daily-foot"></span>
                </div>
                <div class="home-card boot-fill boot-first" style="--h: 83.3px"><span class="skel boot-title"></span></div>
              </div>
            </div>
          </div>
        </div>
        <div class="boot-phone">
          <div class="boot-phone-head">
            <span class="brand-logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 3H8V5H10.5V3H13.5V5H16V3H19V7.72L15 6.3V7.3H10.5A0.7 0.7 0 0 0 10.5 8.7H15V9.7L19 8.28V11H15.5C15.5 15 16.5 17 19.5 18V21H4.5V18C7.5 17 8.5 15 8.5 11H5Z" /></svg></span>
            <span class="skel" style="width: 110px; height: 18px"></span>
          </div>
          <div class="phone-home">
            <div class="phone-welcome boot-fill boot-phone-welcome boot-returning">
              <span class="skel" style="width: 60%; height: 26px"></span>
              <span class="skel" style="width: 85%; height: 13px"></span>
            </div>
            <div class="home-card accent-card boot-fill boot-returning" style="--h: 154px"></div>
            <div class="boot-fill boot-returning" style="--h: 36px"></div>
            <div class="phone-welcome boot-fill boot-first boot-first-welcome"><span class="skel" style="width: 75%; height: 26px"></span></div>
            <div class="home-card accent-card boot-fill boot-first boot-hero"></div>
            <div class="home-card boot-fill boot-daily-compact"></div>
          </div>
          <div class="boot-tabs"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
