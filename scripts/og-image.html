<!doctype html>
<!--
  Link preview card (public/og.png, 1200×630). To regenerate, open this file in a
  1200×630 headless browser at device scale 1 and screenshot the page, e.g. with Playwright:
    page.setViewportSize({ width: 1200, height: 630 }); page.goto('file://…/scripts/og-image.html')
    page.screenshot({ path: 'public/og.png' })
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../node_modules/@lichess-org/chessground/assets/chessground.cburnett.css" />
    <style>
      @font-face {
        font-family: Geist;
        src: url('../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'Geist Mono';
        src: url('../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0b0b0c;
        color: #ededed;
        font-family: Geist, sans-serif;
        position: relative;
      }
      .copy {
        position: absolute;
        left: 80px;
        top: 0;
        bottom: 0;
        width: 560px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .brand img {
        width: 76px;
        height: 76px;
      }
      .brand span {
        font-size: 64px;
        font-weight: 650;
        letter-spacing: -0.035em;
      }
      h1 {
        margin-top: 44px;
        font-size: 50px;
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 1.1;
      }
      p {
        margin-top: 20px;
        font-size: 26px;
        color: #a1a1aa;
        line-height: 1.4;
      }
      .url {
        position: absolute;
        left: 80px;
        bottom: 52px;
        font-family: 'Geist Mono', monospace;
        font-size: 22px;
        color: #71717a;
      }
      /* A crop of the board after Morphy's 10. Nxb5!!, bleeding off the right edge. */
      .board {
        position: absolute;
        left: 690px;
        top: 75px;
        display: grid;
        grid-template-columns: repeat(8, 120px);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
      }
      .sq {
        width: 120px;
        height: 120px;
        position: relative;
      }
      .light {
        background: #d9dce1;
      }
      .dark {
        background: #8e96a1;
      }
      .moved::after {
        content: '';
        position: absolute;
        inset: 0;
        background: rgba(139, 92, 246, 0.55);
      }
      .cg-wrap piece {
        position: absolute;
        inset: 0;
        z-index: 1;
        background-size: cover;
      }
      .badge {
        position: absolute;
        top: -14px;
        right: -14px;
        width: 50px;
        height: 50px;
        z-index: 2;
        filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.45));
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="brand">
        <img src="../public/favicon.svg" alt="" />
        <span>Rookahead</span>
      </div>
      <h1>Free chess game review</h1>
      <p>Stockfish 19 grades every move, Legendary to Blunder. No sign-up.</p>
    </div>
    <div class="url">rookahead.com</div>
    <div class="board cg-wrap" id="board"></div>
    <script>
      const fen = 'rn2kb1r/p3qppp/2p2n2/1N2p1B1/2B1P3/1Q6/PPP2PPP/R3K2R'
      const names = { p: 'pawn', n: 'knight', b: 'bishop', r: 'rook', q: 'queen', k: 'king' }
      const moved = ['c3', 'b5']
      const board = document.getElementById('board')
      fen.split('/').forEach((row, r) => {
        let f = 0
        for (const ch of row) {
          if (/\d/.test(ch)) {
            for (let i = 0; i < Number(ch); i++) square(r, f++, null)
          } else square(r, f++, ch)
        }
      })
      function square(r, f, ch) {
        const sq = document.createElement('div')
        const name = 'abcdefgh'[f] + (8 - r)
        sq.className = `sq ${(r + f) % 2 ? 'dark' : 'light'}${moved.includes(name) ? ' moved' : ''}`
        if (ch) {
          const piece = document.createElement('piece')
          piece.className = `${names[ch.toLowerCase()]} ${ch === ch.toUpperCase() ? 'white' : 'black'}`
          sq.append(piece)
        }
        if (name === 'b5') {
          sq.insertAdjacentHTML(
            'beforeend',
            `<svg class="badge" viewBox="0 0 100 100"><rect x="4" y="4" width="92" height="92" rx="28" fill="#8b5cf6"/><text x="50" y="52" text-anchor="middle" dominant-baseline="central" font-size="50" font-weight="800" fill="#fff" letter-spacing="-4" font-family="Geist">!!</text></svg>`,
          )
        }
        board.append(sq)
      }
    </script>
  </body>
</html>
