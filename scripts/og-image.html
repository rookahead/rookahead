<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../node_modules/@lichess-org/chessground/assets/chessground.cburnett.css" />
    <style>
      @font-face {
        font-family: Cabin;
        src: url('../node_modules/@fontsource-variable/cabin/files/cabin-latin-wght-normal.woff2') format('woff2');
        font-weight: 400 700;
      }
      @font-face {
        font-family: 'Geist Mono';
        src: url('../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0b0b0c;
        color: #ededed;
        font-family: Cabin, sans-serif;
        position: relative;
      }
      .copy {
        position: absolute;
        left: 80px;
        top: 0;
        bottom: 0;
        width: 560px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .brand img {
        width: 76px;
        height: 76px;
      }
      /* The wordmark as the site draws it: ROOK in the text colour, AHEAD grey. */
      .brand svg {
        height: 50px;
        width: auto;
        fill: #ededed;
      }
      .brand .tail {
        fill: #8c8c90;
      }
      h1 {
        margin-top: 44px;
        font-size: 52px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }
      p {
        margin-top: 20px;
        font-size: 26px;
        color: #a1a1aa;
        line-height: 1.4;
      }
      .url {
        position: absolute;
        left: 80px;
        bottom: 52px;
        font-family: 'Geist Mono', monospace;
        font-size: 22px;
        color: #71717a;
      }
      /* A crop of the board after Morphy's 10. Nxb5!!, bleeding off the right edge, in the board's blues. */
      .board {
        position: absolute;
        left: 690px;
        top: 75px;
        display: grid;
        grid-template-columns: repeat(8, 120px);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
      }
      .sq {
        width: 120px;
        height: 120px;
        position: relative;
      }
      .light {
        background: #a5b9e8;
      }
      .dark {
        background: #3c6bd7;
      }
      .moved::after {
        content: '';
        position: absolute;
        inset: 0;
        background: rgba(139, 92, 246, 0.55);
      }
      .cg-wrap piece {
        position: absolute;
        inset: 0;
        z-index: 1;
        background-size: cover;
      }
      .badge {
        position: absolute;
        top: -16px;
        right: -16px;
        width: 54px;
        height: 54px;
        z-index: 2;
        filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.45));
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="brand">
        <img src="../public/favicon.svg" alt="" />
        <svg viewBox="-10 -10 6552 720" role="img" aria-label="Rookahead"><clipPath id="wm"><path d="M-100 -100L3282.3 -100L2683.5 800L-100 800Z" /></clipPath><path d="M60 0H480Q585 0 632.5 47.5Q680 95 680 200V290Q680 373 652.5 419Q625 465 565 480L690 700H495L380 490H240V700H60ZM500 200Q500 140 440 140H240V350H440Q500 350 500 290ZM1420 565Q1420 700 1285 700H905Q770 700 770 565V135Q770 0 905 0H1285Q1420 0 1420 135ZM1226 204Q1226 172 1194 172H996Q964 172 964 204V496Q964 528 996 528H1194Q1226 528 1226 496ZM2160 565Q2160 700 2025 700H1645Q1510 700 1510 565V135Q1510 0 1645 0H2025Q2160 0 2160 135ZM1966 204Q1966 172 1934 172H1736Q1704 172 1704 204V496Q1704 528 1736 528H1934Q1966 528 1966 496ZM2450 700H2270V0H2450V275H2540L2696 0H2886L2690 345L2885 700H2695L2540 415H2450Z" clip-path="url(#wm)" /><path class="tail" d="M2971 700H2776L3241.7 0H3441.7L3506 700H3311L3301.8 575H3051.8ZM3134.1 445H3294.1L3281.5 210ZM4176 700H3996L4077.7 415H3827.7L3746 700H3566L3766.7 0H3946.7L3867.9 275H4117.9L4196.7 0H4376.7ZM4861 700H4306L4506.7 0H5061.7L5021.6 140H4646.6L4607.9 275H4902.9L4862.7 415H4567.7L4526.1 560H4901.1ZM5076 700H4881L5346.7 0H5546.7L5611 700H5416L5406.8 575H5156.8ZM5239.1 445H5399.1L5386.5 210ZM6261.7 0Q6374.7 0 6416.4 58.5Q6458.2 117 6425.8 230L6357 470Q6324.5 583 6249.3 641.5Q6174 700 6061 700H5671L5871.7 0ZM6245.8 230Q6271.6 140 6181.6 140H6011.6L5891.1 560H6061.1Q6151.1 560 6177 470Z" /></svg>
      </div>
      <h1>Free chess game review</h1>
      <p>Stockfish 19 grades every move, Legendary to Blunder. No sign-up.</p>
    </div>
    <div class="url">rookahead.com</div>
    <div class="board cg-wrap" id="board"></div>
    <script>
      const fen = 'rn2kb1r/p3qppp/2p2n2/1N2p1B1/2B1P3/1Q6/PPP2PPP/R3K2R'
      const names = { p: 'pawn', n: 'knight', b: 'bishop', r: 'rook', q: 'queen', k: 'king' }
      const moved = ['c3', 'b5']
      const board = document.getElementById('board')
      fen.split('/').forEach((row, r) => {
        let f = 0
        for (const ch of row) {
          if (/\d/.test(ch)) {
            for (let i = 0; i < Number(ch); i++) square(r, f++, null)
          } else square(r, f++, ch)
        }
      })
      function square(r, f, ch) {
        const sq = document.createElement('div')
        const name = 'abcdefgh'[f] + (8 - r)
        sq.className = `sq ${(r + f) % 2 ? 'dark' : 'light'}${moved.includes(name) ? ' moved' : ''}`
        if (ch) {
          const piece = document.createElement('piece')
          piece.className = `${names[ch.toLowerCase()]} ${ch === ch.toUpperCase() ? 'white' : 'black'}`
          sq.append(piece)
        }
        if (name === 'b5') {
          sq.insertAdjacentHTML(
            'beforeend',
            `<svg class="badge" viewBox="0 0 100 100"><rect x="6" y="6" width="88" height="88" rx="11" fill="#8b5cf6" stroke="#fff" stroke-width="8"/><g transform="translate(50 50) scale(0.86) translate(-50 -50)"><path d="M36 28V54.3M57 28V54.3" fill="none" stroke="#fff" stroke-linecap="round" stroke-width="11"/><circle cx="36" cy="71.1" r="6.3" fill="#fff"/><circle cx="57" cy="71.1" r="6.3" fill="#fff"/><path d="M77 14Q78.6 22.4 87 24Q78.6 25.6 77 34Q75.4 25.6 67 24Q75.4 22.4 77 14Z" fill="#fff"/></g></svg>`,
          )
        }
        board.append(sq)
      }
    </script>
  </body>
</html>
